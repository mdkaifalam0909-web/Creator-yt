name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Files with Exact Firebase Package
        run: |
          # Firebase project package name match: com.streamsphere.app
          flutter create . --project-name apexstream --platforms=android --org com.streamsphere

          # Permissions inject (Internet + Storage)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml || true

          # Android SDK versions set
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexStream-Release-App
          path: build/app/outputs/flutter-apk/app-release.apk
