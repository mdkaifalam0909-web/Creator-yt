name: Build Production APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Latest Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Project & Inject Code
        run: |
          flutter create --org com.streamsphere.app my_app
          cp pubspec.yaml my_app/pubspec.yaml
          cp lib/main.dart my_app/lib/main.dart
          
          # Android Permissions for Gallery & Cloud
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' my_app/android/app/src/main/AndroidManifest.xml
          
          cd my_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Deliver APK File
        uses: actions/upload-artifact@v4
        with:
          name: ApexStream-FullProduction-APK
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
